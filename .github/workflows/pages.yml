name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WebAssembly app
        run: dotnet publish SmartHomeAutomations/SmartHomeAutomations.csproj --configuration Release --output "$RUNNER_TEMP/site"

      - name: Add static-hosting support files
        run: |
          touch "$RUNNER_TEMP/site/wwwroot/.nojekyll"
          cp "$RUNNER_TEMP/site/wwwroot/index.html" "$RUNNER_TEMP/site/wwwroot/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site/wwwroot

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
